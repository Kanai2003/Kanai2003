# Generates the images shown in the profile README (contribution snake and GitHub
# trophies) and publishes them to the `output` branch. Everything is built here,
# so the README never depends on a third-party image service staying online.
# Runs daily, on every push to main, and on demand.
name: Generate profile images

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#2443e0&color_dots=#e9edf3,#c1ccf8,#8ea2f2,#5874ea,#2443e0
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7d95ff&color_dots=#161b22,#1d2647,#33479a,#5a71db,#7d95ff

      # Official github-profile-trophy action, pinned to a reviewed commit.
      - name: Generate trophies (light)
        continue-on-error: true
        uses: ryo-ma/github-profile-trophy@43736b50a82fca73c8df1c81abb40aa03519975c
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/trophies.svg
          theme: flat

      - name: Generate trophies (dark)
        continue-on-error: true
        uses: ryo-ma/github-profile-trophy@43736b50a82fca73c8df1c81abb40aa03519975c
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/trophies-dark.svg
          theme: darkhub

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
